name: P2P Network Node (Alive)

on:
    schedule:
        - cron: "50 1-23/2 * * *"
    workflow_dispatch:

jobs:
    p2p-connect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install P2P Dependencies
              run: |
                  mkdir -p .p2p-runtime
                  cp p2p_connect.js .p2p-runtime/
                  cd .p2p-runtime
                  npm init -y
                  npm install gun ws --no-audit --no-fund

            - name: Connect to Hive
              continue-on-error: true
              run: |
                  cd .p2p-runtime
                  node p2p_connect.js --name "OpenClaw-Core" --type "scientific" --spec "Core AI Platform & Self-Improvement Engine" --duration 550 || {
                    echo "::warning::P2P keepalive failed. Treating this scheduled monitor as best-effort because external relay nodes can sleep or reject transient connections."
                    exit 0
                  }
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
